<!DOCTYPE html>

    <head>
        <title>Community</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <style>
            body {background-color:#131313;}



            a:link {
                color:#ff0000;
                background-color: transparent;
                text-decoration: none;
            }

            A:visited {
                color:#0061ff;
                background-color: transparent;
                text-decoration: none;
            }

            a:hover {
                color: purple;
                background-color: transparent;
                text-decoration: underline;

            }

            .h1 {
                color: white;
                text-align: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;;
                font-size: 50px;
            }

            .p1 {
                color: white;
                text-align: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 18px;
            }

            Image {
                border: solid black;
                padding: 10px;
            }

            .gallery {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                max-width:fit-content;
                margin-left:auto;
                margin-right:auto;
            }

            .gallery-item {
                margin: 5px;
                border: 1px solid gray;
                display: inline-block;
                overflow: hidden;
                max-width: 502px;
                max-height: 394px;
            }

            .gallery-item-image {
                -webkit-transition-duration: 0.2s;
            }

            .gallery-item-image:hover {
                transform:scale(1.1);
            }

            .gallery-item-text {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: white;
                padding: 1px;
                text-align:center;
            }

            .footer {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                background-color: #1c1c1c;
             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-align: center;
                color: gray;
                z-index: 1000;
            }

            .button {
                color: #ff0000;
                background-color: black;
                text-align: left;
                font-size: 20px;
                padding: 2px;
            }
            .button2 {

                color: #ff0000;
                background-color: black;
                text-align: left;
                font-size: 20px;
                padding: 2px;
            }

            .divspacer {
                height: 100px;
            }
            
            .divspacer2 {
                height: 0.2px;
            }

            .divspacer3 {
                block-size: 200px;
            }

            .banner { 
                padding-left: 210px;
            }

        </style>
